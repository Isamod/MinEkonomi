<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Min Ekonomi</title>
<style>
/* ── DESIGN TOKENS ──────────────────────────────────────────────────────── */
:root {
  --bg:    #2a2923;
  --bg2:   #333330;
  --bg3:   #3d3c37;
  --bd:    #4e4d46;
  --bd2:   #62615a;
  --tx:    #f2ede3; /* 13.7:1 ✓ AAA */
  --tx2:   #c3bdb0; /* 8.7:1  ✓ AAA */
  --tx3:   #9e9890; /* 5.4:1  ✓ AA  */
  --pink:  #fac7e6; /* 9.0:1  ✓ AAA */
  --green: #98c474; /* 7.7:1  ✓ AAA */
  --purp:  #b48ec0; /* 6.0:1  ✓ AA  */
  --red:   #f28b8b; /* 4.9:1  ✓ AA  */
  --amb:   #e8c070; /* 8.9:1  ✓ AAA */
  --gbg:   #1b2714;
  --rbg:   #2e1414;
  --ambg:  #2e2610;
  --r: 10px; --r2: 14px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--tx); min-height: 100vh; line-height: 1.5; }
.app { max-width: 920px; margin: 0 auto; padding: 0 0 4rem; }

/* ── TYPE ───────────────────────────────────────────────────────────────── */
.lbl { font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--tx3); display: block; margin-bottom: 6px; }
.sec-ttl { font-size: 13px; font-weight: 600; color: var(--tx2); margin-bottom: 1rem; display: flex; align-items: center; justify-content: space-between; }

/* ── LAYOUT ─────────────────────────────────────────────────────────────── */
.card { background: var(--bg2); border: 1px solid var(--bd); border-radius: var(--r2); padding: 1.25rem; margin-bottom: .85rem; }
.card-accent { border-top: 3px solid var(--pink); }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px; }
.g4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.mets { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin-top: 1rem; }

/* ── INPUTS ─────────────────────────────────────────────────────────────── */
.iw { position: relative; }
.iw .px { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--tx3); pointer-events: none; z-index: 1; }
input[type=text], input[type=email], input[type=password] {
  width: 100%; background: var(--bg3); border: 1px solid var(--bd); border-radius: var(--r);
  color: var(--tx); font-size: 13px; font-family: inherit; outline: none;
  transition: border-color .15s, background .15s; padding: 9px 10px 9px 28px;
}
input.nopx { padding-left: 10px; }
input:focus { border-color: var(--pink); background: #46453f; }
input::placeholder { color: var(--tx3); }

/* ── BUTTONS ─────────────────────────────────────────────────────────────── */
button { font-family: inherit; cursor: pointer; border: none; transition: opacity .12s, transform .1s; }
button:active { transform: scale(.97); }
.btn-p { background: var(--pink); color: #1e1209; font-size: 13px; font-weight: 600; padding: 10px 20px; border-radius: var(--r); }
.btn-p:hover { opacity: .88; }
.btn-p:disabled { opacity: .5; cursor: default; transform: none; }
.btn-s { background: none; border: 1px solid var(--bd2); color: var(--tx2); font-size: 12px; padding: 8px 16px; border-radius: var(--r); }
.btn-s:hover { border-color: var(--pink); color: var(--pink); }
.btn-g { background: none; color: var(--tx3); font-size: 11px; padding: 5px 10px; border-radius: 6px; border: 1px solid transparent; }
.btn-g:hover { border-color: var(--bd); color: var(--tx2); }
.btn-full { width: 100%; padding: 11px; border-radius: var(--r); font-size: 13px; font-weight: 600; }
.add-row { width: 100%; padding: 8px; border: 1px dashed var(--bd); border-radius: var(--r); background: none; font-size: 11px; color: var(--tx3); margin-top: 6px; }
.add-row:hover { border-color: var(--green); color: var(--green); background: var(--gbg); }
.rm { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--bd); background: none; color: var(--tx3); font-size: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.rm:hover { background: var(--rbg); border-color: var(--red); color: var(--red); }
.tog { width: 36px; height: 20px; border-radius: 10px; background: var(--bd2); border: none; position: relative; transition: background .2s; flex-shrink: 0; }
.tog.on { background: var(--green); }
.tog::after { content: ''; position: absolute; width: 14px; height: 14px; border-radius: 50%; background: #fff; top: 3px; left: 3px; transition: left .2s; }
.tog.on::after { left: 19px; }

/* ── METRICS ─────────────────────────────────────────────────────────────── */
.met { background: var(--bg3); border-radius: var(--r); padding: .85rem; }
.met-l { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--tx3); margin-bottom: 4px; }
.met-v { font-size: 18px; font-family: Georgia, serif; letter-spacing: -.02em; }

/* ── ALERTS ──────────────────────────────────────────────────────────────── */
.tip { font-size: 12px; border-radius: var(--r); padding: .7rem .9rem; margin-top: .75rem; line-height: 1.55; border-left: 3px solid; }
.tip-ok  { color: var(--green); background: var(--gbg);  border-color: var(--green); }
.tip-w   { color: var(--amb);   background: var(--ambg); border-color: var(--amb); }
.tip-err { color: var(--red);   background: var(--rbg);  border-color: var(--red); }
.tip-n   { color: var(--tx2);   background: var(--bg3);  border-color: var(--bd2); }
.badge { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; border-radius: 9px; background: var(--red); color: #fff; font-size: 10px; font-weight: 700; padding: 0 4px; }

/* ── TABS ────────────────────────────────────────────────────────────────── */
.tabs { display: flex; gap: 2px; padding: 0 1.25rem; margin-bottom: .9rem; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab-btn { padding: 7px 14px; border-radius: var(--r); background: none; color: var(--tx3); font-size: 13px; white-space: nowrap; border: none; }
.tab-btn.on { background: var(--bg2); color: var(--pink); font-weight: 600; border: 1px solid var(--bd); }

/* ── HEADER ─────────────────────────────────────────────────────────────── */
.hdr { padding: .9rem 1.25rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--bd); margin-bottom: .9rem; gap: 10px; flex-wrap: wrap; }

/* ── MONTH NAV ───────────────────────────────────────────────────────────── */
.mn-wrap { display: flex; align-items: center; gap: 6px; background: var(--bg2); border: 1px solid var(--bd); border-radius: var(--r); padding: 4px 6px; }
.mn-arr { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--bd); background: none; color: var(--tx2); font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.mn-arr:hover { border-color: var(--pink); color: var(--pink); }
.mn-sel { background: none; border: none; color: var(--tx); font-size: 12px; font-family: inherit; outline: none; cursor: pointer; padding: 2px 4px; min-width: 110px; text-align: center; }
.mn-sel option { background: var(--bg2); }
.mn-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex-shrink: 0; }

/* ── AUTH ────────────────────────────────────────────────────────────────── */
.auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
.auth-box { width: 100%; max-width: 360px; }
.auth-logo { text-align: center; margin-bottom: 2rem; }
.auth-logo-mark { font-size: 28px; font-family: Georgia, serif; color: var(--pink); letter-spacing: -.03em; }
.auth-logo-sub { font-size: 11px; text-transform: uppercase; letter-spacing: .15em; color: var(--tx3); margin-top: 4px; }
.auth-card { background: var(--bg2); border: 1px solid var(--bd); border-radius: var(--r2); padding: 1.75rem; }
.auth-title { font-size: 17px; font-weight: 600; color: var(--tx); margin-bottom: 1.25rem; }
.field { margin-bottom: .85rem; }
.field label { display: block; font-size: 11px; color: var(--tx2); margin-bottom: 5px; font-weight: 500; }
.auth-link { font-size: 12px; color: var(--tx3); text-align: center; margin-top: .85rem; }
.auth-link span { color: var(--pink); cursor: pointer; text-decoration: underline; }

/* ── 50/30/20 ────────────────────────────────────────────────────────────── */
.rule-grid { border-radius: var(--r); overflow: hidden; border: 1px solid var(--bd); margin-bottom: .85rem; }
.rule-cell { padding: 1.1rem; }
/* Unified palette — same colors used in boxes AND progress bar AND charts      */
/* Kontrast mot #1c1b18: Fasta 7.3:1 | Nöje 8.4:1 | Sparande 7.2:1 — alla AA */
.rule-cell.needs { background: #7BAFD4; border-bottom: 3px solid #4a84aa; }
.rule-cell.wants { background: #F4A261; border-bottom: 3px solid #c4682a; }
.rule-cell.saves { background: #6DB87A; border-bottom: 3px solid #3a8a4a; }
.rule-pct { font-size: 28px; font-family: Georgia, serif; letter-spacing: -.02em; margin-bottom: 3px; font-weight: 700; }
/* All text #1c1b18 — verified 7-8:1 contrast on all three backgrounds */
.rule-cell.needs .rule-pct, .rule-cell.needs .rule-lbl { color: #1c1b18; }
.rule-cell.wants .rule-pct, .rule-cell.wants .rule-lbl { color: #1c1b18; }
.rule-cell.saves .rule-pct, .rule-cell.saves .rule-lbl { color: #1c1b18; }
.rule-cell.needs .rule-pct { text-shadow: none; }
.rule-cell.wants .rule-pct { text-shadow: none; }
.rule-cell.saves .rule-pct { text-shadow: none; }
.rule-lbl { font-size: 9px; text-transform: uppercase; letter-spacing: .14em; font-weight: 700; margin-bottom: 8px; }
/* "Max x%" — #2e2c28 gives 9.3:1 on all three bright backgrounds — WCAG AAA */
.rule-cell .rule-rec   { font-size: 10px; color: #2e2c28; margin-bottom: 4px; }
.rule-cell .rule-amt   { font-size: 12px; font-weight: 600; color: #1c1b18; margin-bottom: 2px; }
.rule-cell .rule-status-ok  { font-size: 10px; color: #0d3318; }
.rule-cell .rule-status-bad { font-size: 10px; color: #4a0a10; }

/* ── PROGRESS ────────────────────────────────────────────────────────────── */
.prog-t { height: 7px; border-radius: 4px; background: var(--bg3); overflow: hidden; }
.prog-f { height: 100%; border-radius: 4px; transition: width .4s; }

/* ── JAR CARDS ───────────────────────────────────────────────────────────── */
.jar-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 10px; margin-top: .85rem; }
.jar-card { background: var(--bg2); border: 1px solid var(--bd); border-radius: var(--r2); padding: 1rem; border-top-width: 3px; border-top-style: solid; }
.jar-card.hid { opacity: .55; }

/* ── NOTIF ───────────────────────────────────────────────────────────────── */
.notif-item { padding: 1rem 1.1rem; border-bottom: 1px solid var(--bd); display: flex; flex-direction: column; gap: 8px; }
.notif-item:last-child { border-bottom: none; }

/* ── SPINNER ─────────────────────────────────────────────────────────────── */
.spin { width: 20px; height: 20px; border: 2px solid var(--bd); border-top-color: var(--pink); border-radius: 50%; animation: rot .7s linear infinite; display: inline-block; }
@keyframes rot { to { transform: rotate(360deg); } }
.load-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; }

/* ── PROGNOS INPUTS ──────────────────────────────────────────────────────── */
.prog-field { display: flex; align-items: center; gap: 10px; margin-bottom: .85rem; }
.prog-field label { font-size: 12px; color: var(--tx2); min-width: 160px; flex-shrink: 0; }
.prog-field .iw { flex: 1; max-width: 140px; }

/* ── CONTENT ─────────────────────────────────────────────────────────────── */
.content { padding: 0 1.25rem; }

/* ── RESPONSIVE ──────────────────────────────────────────────────────────── */
.dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 680px) { .dash-grid { grid-template-columns: 1fr; } }
@media (max-width: 600px) {
  .hdr { padding: .75rem 1rem; }
  .content { padding: 0 .85rem; }
  .tabs { padding: 0 .85rem; }
  .g2 { grid-template-columns: 1fr; }
  .g3 { grid-template-columns: 1fr; }
  .g4 { grid-template-columns: 1fr 1fr; }
  .mets { grid-template-columns: 1fr 1fr; }
  .rule-grid.g3 { grid-template-columns: 1fr; }
  .met-v { font-size: 15px; }
  .prog-field { flex-wrap: wrap; }
  .prog-field label { min-width: 100%; }
}
@media (max-width: 380px) {
  .g4 { grid-template-columns: 1fr; }
  .jar-grid { grid-template-columns: 1fr 1fr; }
}
</style>
</head>

<div id="root"></div>

<!-- ② CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

<!-- ③ App -->
<script>
'use strict';
const { createClient } = window.supabase;
const db  = createClient(SUPA_URL, SUPA_KEY);
const { useState, useEffect, useRef, useCallback } = React;
const h   = React.createElement;

// ─── UTILS ───────────────────────────────────────────────────────────────────
const MN    = ['Januari','Februari','Mars','April','Maj','Juni','Juli','Augusti','September','Oktober','November','December'];
const JC    = ['#fac7e6','#98c474','#b48ec0','#e8c070','#7ab3f0','#f28b8b','#80d4b8','#e8a870'];
const today = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; };
const fmtMK = k  => { const [y,m]=k.split('-'); return `${MN[+m-1]} ${y}`; };
const adjMK = (k,delta) => { const [y,m]=k.split('-').map(Number); const d=new Date(y,m-1+delta,1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; };
const kr    = n  => Math.round(n).toLocaleString('sv-SE')+' kr';
const fmtS  = n  => n>=1e6?(n/1e6).toFixed(1).replace('.',',')+' mnkr':n>=1000?Math.round(n/1000)+'tkr':Math.round(n)+' kr';
const pct   = (a,b) => b?Math.round(a/b*100):0;
const fv    = (b,m,months,r) => { const mr=r/100/12; return mr===0?b+m*months:b*Math.pow(1+mr,months)+m*(Math.pow(1+mr,months)-1)/mr; };
const defBudget = () => ({ income:35000, existing:0, expenses:[
  {id:'e1',name:'Hyra / boende',    amount:9500, type:'fixed'},
  {id:'e2',name:'Mat & dagligvaror',amount:3500, type:'fixed'},
  {id:'e3',name:'Transport',        amount:1200, type:'fixed'},
  {id:'e4',name:'El & internet',    amount:500,  type:'fixed'},
  {id:'e5',name:'Nöje & restaurang',amount:2000, type:'fun'},
  {id:'e6',name:'Kläder & shopping',amount:800,  type:'fun'},
  {id:'e7',name:'Streaming',        amount:350,  type:'fun'}
]});

// ─── localStorage helpers (Problem 3 fix) ────────────────────────────────────
const lsGet = (k, fallback=null) => { try { const v=localStorage.getItem(k); return v!==null?JSON.parse(v):fallback; } catch { return fallback; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

// ─── DB HELPERS ───────────────────────────────────────────────────────────────
const q = {
  profile:    uid      => db.from('profiles').select('*').eq('id',uid).single(),
  budgetMths: uid      => db.from('budgets').select('month_key').eq('user_id',uid),
  budget:     (uid,mk) => db.from('budgets').select('*').eq('user_id',uid).eq('month_key',mk).maybeSingle(),
  saveBudget: data     => db.from('budgets').upsert(data, {onConflict:'user_id,month_key'}),
  jars:       uid      => db.from('jars').select('*').eq('user_id',uid).order('sort_order'),
  addJar:     data     => db.from('jars').insert(data).select().single(),
  updJar:     (id,d)   => db.from('jars').update({...d, updated_at: new Date().toISOString()}).eq('id',id),
  delJar:     id       => db.from('jars').delete().eq('id',id),
  notifs:     uid      => db.from('notifications').select('*').eq('user_id',uid).eq('read',false).order('created_at',{ascending:false}),
  markRead:   id       => db.from('notifications').update({read:true}).eq('id',id),
  findEmail:  email    => db.rpc('find_user_by_email', {p_email: email.trim().toLowerCase()}),
  sGoals:     uid      => db.from('shared_goal_members').select('*, shared_goals(*)').eq('user_id',uid).neq('status','declined'),
  sMembers:   ids      => db.from('shared_goal_members').select('*, profiles(name,email)').in('goal_id',ids),
  contribs:   ids      => db.from('shared_goal_contributions').select('*, profiles(name)').in('goal_id',ids).order('contributed_at',{ascending:false}),
  addContrib: data     => db.from('shared_goal_contributions').insert(data),
  allBudgets: uid      => db.from('budgets').select('*').eq('user_id',uid).order('month_key'),
};

// ─── PRIMITIVE COMPONENTS ────────────────────────────────────────────────────
// NumInput: auto-clears zero on focus (Problem 4 fix)
function NumInput({ value, onChange, prefix='kr', onBlurSave }) {
  const num     = parseFloat(value)||0;
  const [disp, setDisp] = useState(num===0?'':String(num));
  const focused = useRef(false);
  useEffect(() => { if (!focused.current) setDisp(num===0?'':String(num)); }, [num]);
  // Dynamic left-padding so prefix never overlaps the number
  const pl = prefix ? (prefix.length <= 1 ? 22 : prefix.length === 2 ? 28 : prefix.length === 3 ? 36 : 44) : 10;
  return h('div',{className:'iw'},
    prefix && h('span',{className:'px'},prefix),
    h('input',{
      type:'text', inputMode:'decimal', value:disp,
      style:{paddingLeft: pl+'px'},
      onChange: e => { setDisp(e.target.value); onChange(parseFloat(e.target.value)||0); },
      onFocus:  e => { focused.current=true; if(disp==='0'||disp==='') { setDisp(''); e.target.select(); } },
      onBlur:   () => { focused.current=false; if(!disp||disp==='') setDisp(''); if(onBlurSave) onBlurSave(); }
    })
  );
}
function TxtInput({value, onChange, ph='', type='text'}) {
  return h('input',{type, value, onChange:e=>onChange(e.target.value), placeholder:ph, className:'nopx'});
}
function Met({lbl,val,col}) {
  return h('div',{className:'met'},
    h('div',{className:'met-l',style:col?{color:col}:{}},lbl),
    h('div',{className:'met-v',style:col?{color:col}:{}},val)
  );
}
function Tip({text,type='n'}) { return h('div',{className:`tip tip-${type}`},text); }
function Card({children,style={},accent=false}) { return h('div',{className:`card${accent?' card-accent':''}`,style},children); }
function Spin() { return h('span',{className:'spin'}); }

// ─── CHART ───────────────────────────────────────────────────────────────────
function ProjChart({data}) {
  const cvs=useRef(null); const chart=useRef(null);
  useEffect(()=>{
    if (!cvs.current) return;
    if (chart.current) { chart.current.destroy(); chart.current=null; }
    chart.current = new Chart(cvs.current,{
      type:'line',
      data:{labels:data.map(d=>d.yr),datasets:[
        {label:'Med avkastning',data:data.map(d=>d.wi),borderColor:'#98c474',backgroundColor:'rgba(152,196,116,.1)',fill:true,tension:.35,pointRadius:data.length<=13?3:0,borderWidth:2},
        {label:'Utan avkastning',data:data.map(d=>d.ni),borderColor:'#4e4d46',borderDash:[5,4],fill:false,tension:.35,pointRadius:0,borderWidth:1.5}
      ]},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+c.dataset.label+': '+Math.round(c.raw).toLocaleString('sv-SE')+' kr'},backgroundColor:'#333330',titleColor:'#f2ede3',bodyColor:'#c3bdb0',borderColor:'#4e4d46',borderWidth:1}},
        scales:{
          x:{grid:{color:'#3d3c37'},ticks:{color:'#9e9890',font:{size:10}},border:{color:'#4e4d46'}},
          y:{grid:{color:'#3d3c37'},ticks:{color:'#9e9890',font:{size:10},callback:v=>fmtS(v)},border:{color:'#4e4d46'}}
        }
      }
    });
    return ()=>{ if(chart.current){chart.current.destroy();chart.current=null;} };
  },[data]);
  return h('div',{style:{position:'relative',height:'220px',marginTop:'.85rem'}},
    h('canvas',{ref:cvs,role:'img','aria-label':'Sparandets tillväxt'})
  );
}

// ─── MONTH NAV (Problem 4 redesign) ──────────────────────────────────────────
function MonthNav({month, months, onGo}) {
  // months[] comes from DB (reloadMonths) — already sorted newest-first.
  // Merge in current month only if not already present (e.g. browsing empty month).
  const hasBudget = mk => months.includes(mk);
  const opts = months.includes(month)
    ? months
    : [month, ...months].sort().reverse(); // newest-first
  return h('div',{className:'mn-wrap'},
    h('button',{className:'mn-arr','aria-label':'Föregående månad',onClick:()=>onGo(adjMK(month,-1))},'‹'),
    h('select',{className:'mn-sel',value:month,onChange:e=>onGo(e.target.value)},
      opts.map(mk =>
        h('option',{key:mk,value:mk}, fmtMK(mk) + (hasBudget(mk) ? '' : ' (ingen budget)'))
      )
    ),
    hasBudget(month) && h('span',{className:'mn-dot',title:'Budget sparad'}),
    h('button',{className:'mn-arr','aria-label':'Nästa månad',onClick:()=>onGo(adjMK(month,1))},'›')
  );
}

// ─── AUTH PAGE ────────────────────────────────────────────────────────────────
function AuthPage() {
  const [mode,setMode]   = useState('login');
  const [form,setForm]   = useState({name:'',email:'',pw:'',pw2:''});
  const [err,setErr]     = useState('');
  const [busy,setBusy]   = useState(false);
  const f = k => v => setForm(p=>({...p,[k]:v}));

  const go = async (fn) => { setErr(''); setBusy(true); try { await fn(); } catch(e) { setErr(e.message); } setBusy(false); };

  const doLogin = () => go(async () => {
    const {error} = await db.auth.signInWithPassword({email:form.email.trim(),password:form.pw});
    if (error) throw new Error(error.message==='Invalid login credentials'?'Fel e-post eller lösenord.':error.message);
  });
  const doRegister = () => go(async () => {
    if (!form.name.trim())            throw new Error('Ange ditt namn.');
    if (!form.email.includes('@'))    throw new Error('Ange en giltig e-postadress.');
    if (form.pw.length<6)             throw new Error('Lösenordet måste vara minst 6 tecken.');
    if (form.pw!==form.pw2)           throw new Error('Lösenorden matchar inte.');
    const {error} = await db.auth.signUp({email:form.email.trim().toLowerCase(),password:form.pw,options:{data:{name:form.name.trim()},emailRedirectTo:window.location.href}});
    if (error) throw new Error(error.message);
    setMode('sent');
  });
  const doForgot = () => go(async () => {
    if (!form.email.includes('@')) throw new Error('Ange en giltig e-postadress.');
    const {error} = await db.auth.resetPasswordForEmail(form.email.trim().toLowerCase(),{redirectTo:window.location.href});
    if (error) throw new Error(error.message);
    setMode('sent_reset');
  });

  const Logo = () => h('div',{className:'auth-logo'},
    h('div',{className:'auth-logo-mark'},'Min Ekonomi'),
    h('div',{className:'auth-logo-sub'},'Personlig finans')
  );

  if (mode==='sent') return h('div',{className:'auth-wrap'},h('div',{className:'auth-box'},h(Logo),
    h('div',{className:'auth-card'},
      h('div',{className:'auth-title',style:{color:'var(--green)'}},'Konto skapat!'),
      h('p',{style:{fontSize:13,color:'var(--tx2)',lineHeight:1.6,marginBottom:'1rem'}},'Kolla din e-post och klicka på bekräftelselänken för att aktivera kontot.'),
      h('button',{className:'btn-p btn-full',onClick:()=>setMode('login')},'Tillbaka')
    )
  ));
  if (mode==='sent_reset') return h('div',{className:'auth-wrap'},h('div',{className:'auth-box'},h(Logo),
    h('div',{className:'auth-card'},
      h('div',{className:'auth-title',style:{color:'var(--pink)'}},'Mail skickat'),
      h('p',{style:{fontSize:13,color:'var(--tx2)',lineHeight:1.6,marginBottom:'1rem'}},'Vi har skickat ett återställningsmail till '+form.email+'.'),
      h('button',{className:'btn-p btn-full',onClick:()=>setMode('login')},'Tillbaka')
    )
  ));

  return h('div',{className:'auth-wrap'},h('div',{className:'auth-box'},h(Logo),
    h('div',{className:'auth-card'},
      mode==='login' && h('div',null,
        h('div',{className:'auth-title'},'Logga in'),
        h('div',{className:'field'},h('label',null,'E-postadress'),h(TxtInput,{value:form.email,onChange:f('email'),ph:'namn@hotmail.com',type:'email'})),
        h('div',{className:'field'},h('label',null,'Lösenord'),h(TxtInput,{value:form.pw,onChange:f('pw'),ph:'••••••',type:'password'})),
        err && h(Tip,{text:err,type:'err'}),
        h('button',{className:'btn-p btn-full',style:{marginTop:'1rem'},onClick:doLogin,disabled:busy}, busy?h(Spin):'Logga in'),
        h('div',{style:{textAlign:'center',marginTop:'1rem'}},
          h('span',{style:{fontSize:12,color:'var(--tx3)',cursor:'pointer',textDecoration:'underline'},onClick:()=>{setMode('forgot');setErr('');}},'Glömt lösenord?')
        ),
        h('div',{className:'auth-link'},'Inget konto? ',h('span',{onClick:()=>{setMode('register');setErr('');}},'Skapa konto'))
      ),
      mode==='register' && h('div',null,
        h('div',{className:'auth-title'},'Skapa konto'),
        h('div',{className:'field'},h('label',null,'Ditt namn'),h(TxtInput,{value:form.name,onChange:f('name'),ph:'Förnamn Efternamn'})),
        h('div',{className:'field'},h('label',null,'E-postadress'),h(TxtInput,{value:form.email,onChange:f('email'),ph:'namn@hotmail.com',type:'email'})),
        h('div',{className:'field'},h('label',null,'Lösenord'),h(TxtInput,{value:form.pw,onChange:f('pw'),ph:'Minst 6 tecken',type:'password'})),
        h('div',{className:'field'},h('label',null,'Bekräfta lösenord'),h(TxtInput,{value:form.pw2,onChange:f('pw2'),ph:'••••••',type:'password'})),
        err && h(Tip,{text:err,type:'err'}),
        h('button',{className:'btn-p btn-full',style:{marginTop:'1rem'},onClick:doRegister,disabled:busy},busy?h(Spin):'Skapa konto'),
        h('div',{className:'auth-link'},'Har konto? ',h('span',{onClick:()=>{setMode('login');setErr('');}},'Logga in'))
      ),
      mode==='forgot' && h('div',null,
        h('div',{className:'auth-title'},'Glömt lösenord'),
        h('p',{style:{fontSize:12,color:'var(--tx2)',marginBottom:'1rem'}},'Vi skickar en återställningslänk till din e-post.'),
        h('div',{className:'field'},h('label',null,'E-postadress'),h(TxtInput,{value:form.email,onChange:f('email'),ph:'namn@hotmail.com',type:'email'})),
        err && h(Tip,{text:err,type:'err'}),
        h('button',{className:'btn-p btn-full',style:{marginTop:'1rem'},onClick:doForgot,disabled:busy},busy?h(Spin):'Skicka återställningsmail'),
        h('div',{className:'auth-link'},h('span',{onClick:()=>{setMode('login');setErr('');}},'‹ Tillbaka'))
      )
    )
  ));
}

// ─── RESET PASSWORD PAGE ──────────────────────────────────────────────────────
function ResetPage() {
  const [pw,setPw]   = useState('');
  const [err,setErr] = useState('');
  const [done,setDone]=useState(false);
  const [busy,setBusy]=useState(false);
  const doReset = async () => {
    setErr('');
    if (pw.length<6) { setErr('Minst 6 tecken.'); return; }
    setBusy(true);
    const {error} = await db.auth.updateUser({password:pw});
    if (error) setErr(error.message);
    else setDone(true);
    setBusy(false);
  };
  if (done) return h('div',{className:'auth-wrap'},h('div',{className:'auth-box'},
    h('div',{className:'auth-card'},
      h('div',{className:'auth-title',style:{color:'var(--green)'}},'Lösenord sparat!'),
      h('p',{style:{fontSize:13,color:'var(--tx2)'}},'Du kan nu logga in med ditt nya lösenord.')
    )
  ));
  return h('div',{className:'auth-wrap'},h('div',{className:'auth-box'},
    h('div',{className:'auth-card'},
      h('div',{className:'auth-title'},'Välj nytt lösenord'),
      h('div',{className:'field'},h('label',null,'Nytt lösenord'),h(TxtInput,{value:pw,onChange:setPw,ph:'Minst 6 tecken',type:'password'})),
      err && h(Tip,{text:err,type:'err'}),
      h('button',{className:'btn-p btn-full',style:{marginTop:'1rem'},onClick:doReset,disabled:busy},busy?h(Spin):'Spara lösenord')

  ));
}

// ─── BUDGET TAB ───────────────────────────────────────────────────────────────
function BudgetTab({budget, onChange, visibleJarMon, onClear, onDelete}) {
  const idRef = useRef(Date.now());
  const fixed   = budget.expenses.filter(e=>e.type==='fixed').reduce((s,e)=>s+e.amount,0);
  const fun     = budget.expenses.filter(e=>e.type==='fun').reduce((s,e)=>s+e.amount,0);
  const disp    = budget.income - fixed - fun - visibleJarMon;
  const np=pct(fixed,budget.income), wp=pct(fun,budget.income), sp=pct(visibleJarMon,budget.income);
  const issues  = [...(np>50?['fasta '+np+'%']:[]), ...(wp>30?['nöje '+wp+'%']:[]), ...(sp<20?['sparande '+sp+'%']:[])];
  const set     = v => onChange({...budget,...v});
  const setExp  = (id,f,v) => onChange({...budget,expenses:budget.expenses.map(e=>e.id===id?{...e,[f]:f==='amount'?v:v}:e)});
  const addExp  = t => { const id='e'+idRef.current++; onChange({...budget,expenses:[...budget.expenses,{id,name:'',amount:0,type:t}]}); };
  const delExp  = id => onChange({...budget,expenses:budget.expenses.filter(e=>e.id!==id)});

  return h('div',null,
    h('div',{style:{display:'flex',gap:8,justifyContent:'flex-end',marginBottom:'.75rem'}},
      h('button',{
        onClick:onClear,
        style:{padding:'6px 12px',fontSize:11,border:'1px solid var(--bd)',borderRadius:'var(--r)',background:'none',color:'var(--tx3)',cursor:'pointer'}
      },'Rensa budget'),
      h('button',{
        onClick:onDelete,
        style:{padding:'6px 12px',fontSize:11,border:'1px solid var(--red)',borderRadius:'var(--r)',background:'none',color:'var(--red)',cursor:'pointer'}
      },'Ta bort månad')
    ),
    h(Card,null,
      h('span',{className:'lbl'},'Inkomst'),
      h('div',{className:'g2',style:{marginBottom:'1rem'}},
        h('div',null, h('div',{style:{fontSize:11,color:'var(--tx2)',marginBottom:4}},'Månadsinkomst (netto)'), h(NumInput,{value:budget.income,onChange:v=>set({income:v})})),
        h('div',null, h('div',{style:{fontSize:11,color:'var(--tx2)',marginBottom:4}},'Befintligt sparande totalt'), h(NumInput,{value:budget.existing,onChange:v=>set({existing:v})}))
      ),
      h('div',{className:'mets'},
        h(Met,{lbl:'Kvar efter allt',val:kr(disp),col:disp<0?'var(--red)':'var(--green)'}),
        h(Met,{lbl:'Utgifter/mån',val:kr(fixed+fun)}),
        h(Met,{lbl:'Sparar/mån',val:kr(visibleJarMon),col:'var(--pink)'})
      )
    ),
    h(Card,null,
      h('div',{className:'sec-ttl'},h('span',null,'Fasta kostnader'),h('span',{style:{color:'var(--purp)',fontFamily:'Georgia,serif',fontSize:16}},kr(fixed))),
      h('div',{style:{display:'grid',gridTemplateColumns:'1fr 110px 28px',gap:7,paddingBottom:6,borderBottom:'1px solid var(--bd)',marginBottom:6}},
        ['Namn','Belopp',''].map((c,i)=>h('span',{key:i,style:{fontSize:9,textTransform:'uppercase',letterSpacing:'.1em',color:'var(--tx3)'}},c))
      ),
      budget.expenses.filter(e=>e.type==='fixed').map(e=>h('div',{key:e.id,style:{display:'grid',gridTemplateColumns:'1fr 110px 28px',gap:7,marginBottom:7,alignItems:'center'}},
        h(TxtInput,{value:e.name,onChange:v=>setExp(e.id,'name',v),ph:'t.ex. Hyra, Klarna…'}),
        h(NumInput,{value:e.amount,onChange:v=>setExp(e.id,'amount',v)}),
        h('button',{className:'rm',onClick:()=>delExp(e.id)},'×')
      )),
      h('button',{className:'add-row',onClick:()=>addExp('fixed')},'+ Lägg till fast kostnad')
    ),
    h(Card,null,
      h('div',{className:'sec-ttl'},h('span',null,'Nöje'),h('span',{style:{color:'#F4A261',fontFamily:'Georgia,serif',fontSize:16}},kr(fun))),
      budget.expenses.filter(e=>e.type==='fun').map(e=>h('div',{key:e.id,style:{display:'grid',gridTemplateColumns:'1fr 110px 28px',gap:7,marginBottom:7,alignItems:'center'}},
        h(TxtInput,{value:e.name,onChange:v=>setExp(e.id,'name',v),ph:'t.ex. Gym, restaurang…'}),
        h(NumInput,{value:e.amount,onChange:v=>setExp(e.id,'amount',v)}),
        h('button',{className:'rm',onClick:()=>delExp(e.id)},'×')
      )),
      h('button',{className:'add-row',onClick:()=>addExp('fun')},'+ Lägg till nöje')
    ),
    h(Card,null,
      h('span',{className:'lbl'},'50/30/20-regeln'),
      h('div',{className:'rule-grid g3'},
        [{cls:'needs',lbl:'Fasta',    p:np,rec:50,amt:fixed,          bad:np>50},
         {cls:'wants',lbl:'Nöje',     p:wp,rec:30,amt:fun,            bad:wp>30},
         {cls:'saves',lbl:'Sparande', p:sp,rec:20,amt:visibleJarMon,  bad:sp<20||sp>100}
        ].map(({cls,lbl,p,rec,amt,bad})=>h('div',{key:cls,className:'rule-cell '+cls},
          h('div',{className:'rule-lbl'},lbl),
          h('div',{className:'rule-pct'},p+'%'),
          h('div',{className:'rule-rec'},(cls==='saves'?'Min':'Max')+' '+rec+'%'),
          h('div',{className:'rule-amt'},kr(amt)),
          h('div',{className:bad?'rule-status-bad':'rule-status-ok'},
            cls==='saves'
              ? (p<rec ? `${rec-p}% under mål` : p>100 ? 'Kontrollera inkomst' : `+${p-rec}% över mål`)
              : (bad   ? `+${p-rec}% över mål` : `${rec-p}% under max`)
          )
        ))
      ),
      h('div',{style:{height:6,borderRadius:3,overflow:'hidden',display:'flex',background:'var(--bg3)',margin:'.75rem 0 .5rem'}},
        h('div',{style:{width:Math.min(np,100)+'%',height:'100%',background:'#7BAFD4'}}),
        h('div',{style:{width:Math.min(wp,Math.max(0,100-np))+'%',height:'100%',background:'#F4A261'}}),
        h('div',{style:{width:Math.min(sp,Math.max(0,100-np-wp))+'%',height:'100%',background:'#6DB87A'}})
      ),
      h('div',{style:{fontSize:10,color:'var(--tx3)'}},'Fast ',np,'%  ·  Nöje ',wp,'%  ·  Sparande ',sp,'%'),
      (() => {
        const over100 = sp > 100;
        if (over100) return h(Tip,{text:'Sparandeprocenten överstiger 100% — kontrollera att inkomsten är korrekt ifylld.',type:'err'});
        if (issues.length) return h(Tip,{text:'Att se över: '+issues.join(', ')+'.',type:'w'});
        return h(Tip,{text:'Din ekonomi matchar 50/30/20-regeln! Fasta max 50%, Nöje max 30%, Sparande minst 20%.',type:'ok'});
      })()
    )
  );
}

  const [editMode,  setEditMode]  = useState('dep');  // 'dep' | 'monthly' | 'goal'
  const [depAmt,    setDepAmt]    = useState(0);
  const [depNote,   setDepNote]   = useState('');
  const [depErr,    setDepErr]    = useState('');
  const [newMonthly,setNewMonthly]= useState(0);
  const [goalEdit,  setGoalEdit]  = useState({name:'',target:0,email:''});
  const [goalEditErr,setGoalEditErr]=useState('');
  const [contribs,  setContribs]  = useState({});     // goalId → [{amount,note,date,name}]
  const [loadingC,  setLoadingC]  = useState({});

  // Load contribution history for all goals
  const loadContribs = async (goals) => {
    if (!goals.length) return;
    const ids = goals.map(g=>g.id);
    const {data} = await q.contribs(ids);
    if (!data) return;
    const map = {};
    ids.forEach(id => { map[id] = []; });
    data.forEach(c => {
      if (!map[c.goal_id]) map[c.goal_id]=[];
      map[c.goal_id].push({
        id:c.id, amount:c.amount, note:c.note||'',
        date: new Date(c.contributed_at).toLocaleDateString('sv-SE'),
        userName: c.profiles?.name||'Okänd', userId: c.user_id
      });
    });
    setContribs(map);
  };

  useEffect(() => { if (sharedGoals.length) loadContribs(sharedGoals); }, [sharedGoals]);

  const createGoal = async () => {
    setErr('');
    if (!form.name.trim())           return setErr('Ange ett målnamn.');
    if (!form.target||form.target<=0)return setErr('Ange ett målbelopp.');
    const pe = form.email.trim().toLowerCase();
    if (!pe.includes('@'))           return setErr('Ange en giltig e-postadress.');
    if (pe===userEmail.toLowerCase())return setErr('Du kan inte bjuda in dig själv.');
    setSaving(true);
    // Problem 2: security definer RPC kringgår RLS
    const {data:foundRaw, error:fe} = await q.findEmail(pe);
    if (fe) {
      setErr('Sökning misslyckades: '+fe.message+'. Kontrollera att find_user_by_email körs i Supabase SQL Editor.');
      setSaving(false); return;
    }
    // rpc() kan returnera array eller objekt beroende på Supabase-version
    const foundArr = Array.isArray(foundRaw) ? foundRaw : (foundRaw ? [foundRaw] : []);
    if (foundArr.length===0) {
      setErr('Ingen användare med den e-postadressen. Personen måste vara registrerad och ha loggat in.');
      setSaving(false); return;
    }
    const partnerId = foundArr[0].id;
    const {data:goal, error:ge} = await db.from('shared_goals').insert({name:form.name.trim(),target:Number(form.target)}).select().single();
    if (ge) { setErr('Kunde inte skapa mål: '+ge.message); setSaving(false); return; }
    const {error:me} = await db.from('shared_goal_members').insert([
      {goal_id:goal.id,user_id:userId,  status:'accepted',contribution:0,monthly_contrib:form.myMonthly||0},
      {goal_id:goal.id,user_id:partnerId,status:'pending', contribution:0,monthly_contrib:0}
    ]);
    if (me) { setErr('Kunde inte lägga till medlemmar: '+me.message); setSaving(false); return; }
    await db.from('notifications').insert({user_id:partnerId,type:'goal_invite',data:{goal_id:goal.id,goal_name:goal.name,target:goal.target,inviter_name:userName||userEmail}});
    setShowForm(false); setForm({name:'',target:0,email:'',myMonthly:0});
    setSaving(false); onReload();
  };

  const addDeposit = async (goalId) => {
    setDepErr('');
    if (!depAmt || depAmt <= 0) { setDepErr('Ange ett belopp.'); return; }
    setLoadingC(p=>({...p,[goalId]:true}));
    // 1. Insert contribution row
    const {error:ce} = await q.addContrib({
      goal_id: goalId, user_id: userId,
      amount: depAmt, note: depNote.trim()||null
    });
    if (ce) { setDepErr('Kunde inte spara: '+ce.message); setLoadingC(p=>({...p,[goalId]:false})); return; }
    // 2. Update running total on member row
    const goal = sharedGoals.find(g=>g.id===goalId);
    const myMem = (goal?.members||[]).find(m=>m.user_id===userId)||{};
    const newTotal = (myMem.contribution||0) + depAmt;
    await db.from('shared_goal_members').update({contribution: newTotal}).eq('goal_id',goalId).eq('user_id',userId);
    // 3. Reset form, reload
    setDepAmt(0); setDepNote(''); setEditId(null); setDepErr('');
    setLoadingC(p=>({...p,[goalId]:false}));
    await loadContribs(sharedGoals);
    onReload();
  };

  const saveMonthly = async (goalId) => {
    await db.from('shared_goal_members')
      .update({monthly_contrib: newMonthly})
      .eq('goal_id', goalId).eq('user_id', userId);
    setEditId(null); onReload();
  };

  const saveGoalEdit = async (goal) => {
    setGoalEditErr('');
    if (!goalEdit.name.trim()) return setGoalEditErr('Ange ett målnamn.');
    if (!goalEdit.target || goalEdit.target <= 0) return setGoalEditErr('Ange ett målbelopp.');
    // Update goal name and target
    const {error} = await db.from('shared_goals')
      .update({name: goalEdit.name.trim(), target: Number(goalEdit.target)})
      .eq('id', goal.id);
    if (error) return setGoalEditErr('Kunde inte spara: '+error.message);
    // Optionally invite a new member
    const newEmail = goalEdit.email.trim().toLowerCase();
    if (newEmail && newEmail.includes('@')) {
      const {data:foundRaw} = await q.findEmail(newEmail);
      const foundArr = Array.isArray(foundRaw) ? foundRaw : (foundRaw ? [foundRaw] : []);
      if (foundArr.length === 0) return setGoalEditErr('Användaren "'+goalEdit.email+'" hittades inte.');
      const newMemberId = foundArr[0].id;
      const alreadyIn = (goal.members||[]).some(m=>m.user_id===newMemberId);
      if (!alreadyIn) {
        await db.from('shared_goal_members').insert({
          goal_id:goal.id, user_id:newMemberId, status:'pending', contribution:0, monthly_contrib:0
        });
        await db.from('notifications').insert({
          user_id:newMemberId, type:'goal_invite',
          data:{goal_id:goal.id, goal_name:goalEdit.name.trim(), target:Number(goalEdit.target), inviter_name:userName||userEmail}
        });
      }
    }
    setEditId(null); setGoalEditErr(''); onReload();
  };

  const leaveGoal = async (goalId) => {
    if (!confirm('Lämna det gemensamma målet?')) return;
    await db.from('shared_goal_members').update({status:'declined'}).eq('goal_id',goalId).eq('user_id',userId);
    onReload();
  };

  return h('div',null,
    h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'.75rem',flexWrap:'wrap',gap:8}},
      h('div',null,
        h('span',{className:'lbl'},'Gemensamt sparande'),
        h('div',{style:{fontSize:11,color:'var(--tx3)'}},'Bjud in via e-post — partnern måste ha ett konto')
      ),
      h('div',{style:{display:'flex',gap:7}},
        h('button',{className:'btn-g',onClick:onReload},'Uppdatera'),
        h('button',{className:'btn-p',style:{fontSize:12,padding:'7px 14px'},onClick:()=>setShowForm(!showForm)},showForm?'Avbryt':'+ Nytt mål')
      )
    ),
    showForm && h(Card,{accent:true},
      h('span',{className:'lbl'},'Skapa gemensamt mål'),
      h('div',{className:'g2',style:{marginBottom:10}},
        h('div',null,h('div',{style:{fontSize:11,color:'var(--tx2)',marginBottom:4}},'Målnamn'),h(TxtInput,{value:form.name,onChange:v=>setForm(p=>({...p,name:v})),ph:'t.ex. Gemensam semesterresa'})),
        h('div',null,h('div',{style:{fontSize:11,color:'var(--tx2)',marginBottom:4}},'Målbelopp (kr)'),h(NumInput,{value:form.target,onChange:v=>setForm(p=>({...p,target:v}))}))
      ),
      h('div',{className:'g2',style:{marginBottom:10}},
        h('div',null,h('div',{style:{fontSize:11,color:'var(--tx2)',marginBottom:4}},'Partners e-postadress'),h(TxtInput,{value:form.email,onChange:v=>setForm(p=>({...p,email:v})),ph:'namn@hotmail.com',type:'email'})),
        h('div',null,h('div',{style:{fontSize:11,color:'var(--tx2)',marginBottom:4}},'Mitt bidrag/mån (kr)'),h(NumInput,{value:form.myMonthly,onChange:v=>setForm(p=>({...p,myMonthly:v}))}))
      ),
      err && h(Tip,{text:err,type:'err'}),
      h('button',{className:'btn-p',style:{marginTop:4},onClick:createGoal,disabled:saving},saving?h(Spin):'Skapa & skicka inbjudan')
    ),
    sharedGoals.length===0 && !showForm && h('div',{style:{textAlign:'center',padding:'2.5rem 1rem',color:'var(--tx3)'}},
      h('div',{style:{fontSize:13,marginBottom:6}},'Inga gemensamma mål ännu'),
      h('div',{style:{fontSize:11}},'Skapa ett mål och bjud in en partner via e-post.')
    ),
    sharedGoals.map((goal,gi)=>{
      const ac=JC[gi%JC.length];
      const myMem=(goal.members||[]).find(m=>m.user_id===userId)||{};
      const myC=myMem.contribution||0, myM=myMem.monthly_contrib||0;
      const others=(goal.members||[]).filter(m=>m.user_id!==userId);
      const totalBal=(goal.members||[]).reduce((s,m)=>s+(m.contribution||0),0);
      const totalMon=(goal.members||[]).reduce((s,m)=>s+(m.monthly_contrib||0),0);
      const progPct=goal.target>0?Math.min(100,Math.round(totalBal/goal.target*100)):0;
      const rem=Math.max(0,(goal.target||0)-totalBal);
      const mthsLeft=totalMon>0?Math.ceil(rem/totalMon):null;
      const isEd=editId===goal.id;
      return h('div',{key:goal.id,style:{background:'var(--bg2)',border:'1px solid var(--bd)',borderRadius:'var(--r2)',marginBottom:'.85rem',overflow:'hidden'}},
        h('div',{style:{borderTop:'3px solid '+ac,padding:'1rem 1.1rem'}},
          h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'.75rem'}},
            h('div',null,
              h('div',{style:{fontSize:14,fontWeight:600,marginBottom:2}},goal.name),
              h('div',{style:{fontSize:11,color:'var(--tx3)'}},'Med '+(others.map(m=>m.profiles?.name||m.profiles?.email||'Partner').join(', ')||'…'))
            ),
            h('div',{style:{textAlign:'right'}},
              h('div',{style:{fontSize:18,fontFamily:'Georgia,serif',color:ac}},fmtS(totalBal)),
              h('div',{style:{fontSize:10,color:'var(--tx3)'}},'av '+kr(goal.target||0))
            )
          ),
          h('div',{className:'prog-t',style:{marginBottom:5}},h('div',{className:'prog-f',style:{width:progPct+'%',background:ac}})),
          h('div',{style:{fontSize:10,color:'var(--tx3)',marginBottom:'.75rem'}},
            progPct+'% klart'+(mthsLeft?' · ~'+mthsLeft+' mån kvar':rem<=0?' · Mål uppnått!':'')
          ),
          h('div',{className:'g2',style:{marginBottom:'.75rem'}},
            h('div',{style:{background:'var(--bg3)',borderRadius:'var(--r)',padding:'.75rem',borderLeft:'2px solid '+ac}},
              h('div',{style:{fontSize:9,textTransform:'uppercase',color:ac,marginBottom:3}},'Ditt bidrag'),
              h('div',{style:{fontSize:15,fontFamily:'Georgia,serif',color:ac}},kr(myC)),
              h('div',{style:{fontSize:10,color:'var(--tx3)'}},'+'+kr(myM)+'/mån')
            ),
            h('div',{style:{background:'var(--bg3)',borderRadius:'var(--r)',padding:'.75rem'}},
              h('div',{style:{fontSize:9,textTransform:'uppercase',color:'var(--tx3)',marginBottom:3}},'Partner'),
              others.length
                ? others.map(m=>h('div',{key:m.id},
                    h('div',{style:{fontSize:9,color:'var(--tx3)'}},(m.profiles?.name||m.profiles?.email||'?')+(m.status==='pending'?' (väntar)':'')),
                    h('div',{style:{fontSize:15,fontFamily:'Georgia,serif'}},kr(m.contribution||0)),
                    h('div',{style:{fontSize:10,color:'var(--tx3)'}},'+'+kr(m.monthly_contrib||0)+'/mån')
                  ))
                : h('div',{style:{fontSize:11,color:'var(--tx3)'}},'Inbjudan skickad…')
            )
          ),
          // ── Deposit form ────────────────────────────────────────────────
          isEd && editMode==='dep' && h('div',{style:{background:'var(--bg3)',borderRadius:'var(--r)',padding:'.85rem',marginBottom:'.75rem'}},
            h('div',{style:{fontSize:10,textTransform:'uppercase',color:'var(--tx3)',letterSpacing:'.1em',marginBottom:10}},'Lägg till insättning'),
            h('div',{className:'g2',style:{marginBottom:8}},
              h('div',null,
                h('div',{style:{fontSize:11,color:'var(--tx2)',marginBottom:4}},'Belopp (kr)'),
                h(NumInput,{value:depAmt,onChange:setDepAmt})
              ),
              h('div',null,
                h('div',{style:{fontSize:11,color:'var(--tx2)',marginBottom:4}},'Kommentar (valfri)'),
                h('input',{type:'text',value:depNote,onChange:e=>setDepNote(e.target.value),
                  placeholder:'t.ex. Lön mars',className:'nopx',
                  style:{width:'100%',background:'var(--bg)',border:'1px solid var(--bd)',borderRadius:'var(--r)',padding:'9px 10px',fontSize:13,color:'var(--tx)',fontFamily:'inherit',outline:'none'}})
              )
            ),
            depErr && h(Tip,{text:depErr,type:'err'}),
            h('div',{style:{display:'flex',gap:7}},
              h('button',{className:'btn-p',style:{fontSize:12,padding:'7px 16px'},
                onClick:()=>addDeposit(goal.id),disabled:loadingC[goal.id]},
                loadingC[goal.id]?h(Spin):'Spara insättning'),
              h('button',{className:'btn-s',style:{fontSize:12,padding:'7px 12px'},onClick:()=>setEditId(null)},'Avbryt')
            )
          ),
          // ── Contribution history ────────────────────────────────────────────
          (contribs[goal.id]||[]).length > 0 && h('div',{style:{marginBottom:'.75rem'}},
            h('div',{style:{fontSize:10,textTransform:'uppercase',letterSpacing:'.1em',color:'var(--tx3)',marginBottom:6}},'Insättningshistorik'),
            h('div',{style:{background:'var(--bg3)',borderRadius:'var(--r)',overflow:'hidden'}},
              (contribs[goal.id]||[]).map((c,ci)=>h('div',{key:c.id,
                style:{display:'flex',justifyContent:'space-between',alignItems:'center',
                  padding:'8px 10px',borderBottom:ci<(contribs[goal.id].length-1)?'1px solid var(--bd)':'none',
                  gap:8}},
                h('div',{style:{flex:1,minWidth:0}},
                  h('div',{style:{fontSize:11,color:c.userId===userId?ac:'var(--tx2)',fontWeight:500}},c.userName),
                  h('div',{style:{fontSize:10,color:'var(--tx3)',whiteSpace:'nowrap'}},c.date+(c.note?' · '+c.note:''))
                ),
                h('div',{style:{display:'flex',alignItems:'center',gap:8,flexShrink:0}},
                  h('div',{style:{fontSize:13,fontFamily:'Georgia,serif',color:c.userId===userId?ac:'var(--tx)'}},'+'+kr(c.amount)),
                  // Only show delete on own contributions
                  c.userId===userId && h('button',{
                    title:'Ta bort insättning',
                    onClick: async()=>{
                      if(!confirm('Ta bort insättningen på '+kr(c.amount)+'?')) return;
                      await db.from('shared_goal_contributions').delete().eq('id',c.id);
                      // Recalculate member total from remaining contributions
                      const remaining = (contribs[goal.id]||[]).filter(x=>x.id!==c.id && x.userId===userId);
                      const newTotal = remaining.reduce((s,x)=>s+x.amount,0);
                      await db.from('shared_goal_members').update({contribution:newTotal}).eq('goal_id',goal.id).eq('user_id',userId);
                      await loadContribs(sharedGoals);
                      onReload();
                    },
                    style:{width:22,height:22,border:'none',background:'none',color:'var(--tx3)',fontSize:14,cursor:'pointer',
                      borderRadius:4,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,padding:0}
                  },'×')
                )
              ))
            )
          ),
          // ── Inline panel: deposit ──────────────────────────────────────────
          // (already rendered above via isEd && editMode==='dep')

          // ── Inline panel: change monthly ───────────────────────────────────
          isEd && editMode==='monthly' && h('div',{style:{background:'var(--bg3)',borderRadius:'var(--r)',padding:'.85rem',marginBottom:'.75rem'}},
            h('div',{style:{fontSize:10,textTransform:'uppercase',color:'var(--tx3)',letterSpacing:'.1em',marginBottom:10}},'Ändra månadsinsättning'),
            h('div',{style:{marginBottom:10}},
              h('div',{style:{fontSize:11,color:'var(--tx2)',marginBottom:4}},'Nytt belopp/mån (kr)'),
              h(NumInput,{value:newMonthly,onChange:setNewMonthly})
            ),
            h('div',{style:{display:'flex',gap:7}},
              h('button',{className:'btn-p',style:{fontSize:12,padding:'7px 16px'},onClick:()=>saveMonthly(goal.id)},'Spara'),
              h('button',{className:'btn-s',style:{fontSize:12,padding:'7px 12px'},onClick:()=>setEditId(null)},'Avbryt')
            )
          ),

          // ── Inline panel: edit goal ─────────────────────────────────────────
          isEd && editMode==='goal' && h('div',{style:{background:'var(--bg3)',borderRadius:'var(--r)',padding:'.85rem',marginBottom:'.75rem'}},
            h('div',{style:{fontSize:10,textTransform:'uppercase',color:'var(--tx3)',letterSpacing:'.1em',marginBottom:10}},'Redigera mål'),
            h('div',{className:'g2',style:{marginBottom:8}},
              h('div',null,
                h('div',{style:{fontSize:11,color:'var(--tx2)',marginBottom:4}},'Målnamn'),
                h(TxtInput,{value:goalEdit.name,onChange:v=>setGoalEdit(p=>({...p,name:v})),ph:'Namn på målet'})
              ),
              h('div',null,
                h('div',{style:{fontSize:11,color:'var(--tx2)',marginBottom:4}},'Nytt målbelopp (kr)'),
                h(NumInput,{value:goalEdit.target,onChange:v=>setGoalEdit(p=>({...p,target:v}))})
              )
            ),
            h('div',{style:{marginBottom:8}},
              h('div',{style:{fontSize:11,color:'var(--tx2)',marginBottom:4}},'Bjud in ytterligare person (e-post, valfritt)'),
              h(TxtInput,{value:goalEdit.email,onChange:v=>setGoalEdit(p=>({...p,email:v})),ph:'namn@hotmail.com',type:'email'})
            ),
            goalEditErr && h(Tip,{text:goalEditErr,type:'err'}),
            h('div',{style:{display:'flex',gap:7}},
              h('button',{className:'btn-p',style:{fontSize:12,padding:'7px 16px'},onClick:()=>saveGoalEdit(goal)},'Spara ändringar'),
              h('button',{className:'btn-s',style:{fontSize:12,padding:'7px 12px'},onClick:()=>setEditId(null)},'Avbryt')
            )
          ),

          // ── Action buttons ──────────────────────────────────────────────────
          !isEd && h('div',{style:{display:'flex',gap:7,flexWrap:'wrap'}},
            h('button',{className:'btn-p',style:{fontSize:11,padding:'6px 14px'},
              onClick:()=>{setEditId(goal.id);setEditMode('dep');setDepAmt(0);setDepNote('');setDepErr('');}},
              '+ Insättning'),
            h('button',{className:'btn-s',style:{fontSize:11,padding:'6px 12px'},
              onClick:()=>{setEditId(goal.id);setEditMode('monthly');setNewMonthly(myM);}},
              'Ändra /mån'),
            h('button',{className:'btn-s',style:{fontSize:11,padding:'6px 12px'},
              onClick:()=>{setEditId(goal.id);setEditMode('goal');setGoalEdit({name:goal.name,target:goal.target,email:''});setGoalEditErr('');}},
              'Redigera mål'),
            h('button',{className:'btn-g',style:{color:'var(--red)',fontSize:11},onClick:()=>leaveGoal(goal.id)},'Lämna')
          )
        )
      );
    })
  );
}

// ─── PROGNOS TAB (Problem 5 fix – number inputs instead of sliders) ───────────
function PrognosTab({budget, jars}) {
  const [projSave, setProjSave]   = useState(5000);
  const [projYears, setProjYears] = useState(10);
  const [projRate, setProjRate]   = useState(4);
  const [goalAmt, setGoalAmt]     = useState(100000);
  const [goalMths, setGoalMths]   = useState(36);
  const [goalRate, setGoalRate]   = useState(4);

  const existing = budget.existing||0;
  const months   = Math.max(1, projYears) * 12;
  const projData = [];
  for (let y=0; y<=Math.max(1,projYears); y++) {
    const m=y*12, mr=projRate/100/12;
    const ni=existing+projSave*m;
    const wi=mr===0?ni:existing*Math.pow(1+mr,m)+projSave*(Math.pow(1+mr,m)-1)/mr;
    projData.push({yr:y===0?'Nu':String(new Date().getFullYear()+y),wi:Math.round(wi),ni:Math.round(ni)});
  }
  const fin=projData[projData.length-1];
  const mr2=goalRate/100/12;
  let gReq=mr2===0?(goalAmt-existing)/Math.max(1,goalMths)
    :((goalAmt-existing*Math.pow(1+mr2,goalMths))*mr2/(Math.pow(1+mr2,goalMths)-1));
  gReq=Math.max(0,gReq);
  const gPaid=gReq*goalMths, gInt=Math.max(0,goalAmt-existing-gPaid);
  const visJarMon=jars.reduce((s,j)=>s+(j.monthly||0),0); // Alla lådor

  // Shared field style
  const fieldRow = (lbl, val, set, prefix='kr') => h('div',{className:'prog-field'},
    h('label',null,lbl),
    h(NumInput,{value:val, onChange:v=>set(Math.max(0,v)), prefix})
  );

  return h('div',null,
    h(Card,null,
      h('span',{className:'lbl'},'Framtidsprognos'),
      h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:12,marginBottom:'1.25rem'},className:'g3'},
        h('div',null,
          h('div',{style:{fontSize:11,color:'var(--tx2)',marginBottom:6}},'Sparar per månad'),
          h(NumInput,{value:projSave,onChange:v=>setProjSave(Math.max(0,v))})
        ),
        h('div',null,
          h('div',{style:{fontSize:11,color:'var(--tx2)',marginBottom:6}},'Tidshorisont (år)'),
          h(NumInput,{value:projYears,onChange:v=>setProjYears(Math.max(1,Math.min(50,v))),prefix:'år'})
        ),
        h('div',null,
          h('div',{style:{fontSize:11,color:'var(--tx2)',marginBottom:6}},'Avkastning per år'),
          h(NumInput,{value:projRate,onChange:v=>setProjRate(Math.max(0,Math.min(20,v))),prefix:'%'})
        )
      ),
      h('div',{style:{display:'flex',gap:14,marginBottom:6}},
        [['Med avkastning','#98c474'],['Utan avkastning','#4e4d46']].map(([l,c])=>
          h('div',{key:l,style:{display:'flex',alignItems:'center',gap:5,fontSize:11,color:'var(--tx3)'}},
            h('div',{style:{width:18,height:2,background:c}}),l)
        )
      ),
      h(ProjChart,{data:projData}),
      h(Tip,{text:`Om ${projYears} år: ${kr(fin?.wi||0)} — varav ${kr(Math.max(0,(fin?.wi||0)-(fin?.ni||0)))} i avkastning.`,type:'ok'})
    ),
    h(Card,null,
      h('span',{className:'lbl'},'Vad krävs för att nå ett sparmål?'),
      h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:12,marginBottom:'1rem'},className:'g3'},
        h('div',null, h('div',{style:{fontSize:11,color:'var(--tx2)',marginBottom:6}},'Målbelopp (kr)'), h(NumInput,{value:goalAmt,onChange:setGoalAmt})),
        h('div',null, h('div',{style:{fontSize:11,color:'var(--tx2)',marginBottom:6}},'Antal månader'), h(NumInput,{value:goalMths,onChange:v=>setGoalMths(Math.min(600,Math.max(1,v))),prefix:'mån'})),
        h('div',null, h('div',{style:{fontSize:11,color:'var(--tx2)',marginBottom:6}},'Avkastning/år'), h(NumInput,{value:goalRate,onChange:v=>setGoalRate(Math.min(30,Math.max(0,v))),prefix:'%'}))
      ),
      h('div',{className:'mets'},
        h(Met,{lbl:'Krävs per månad',val:kr(gReq),col:gReq>visJarMon?'var(--red)':'var(--green)'}),
        h(Met,{lbl:'Totalt inbetalt',val:kr(gPaid)}),
        h(Met,{lbl:'Avkastning',val:kr(gInt),col:'var(--green)'})
      ),
      gReq>visJarMon
        ? h(Tip,{text:`Du behöver ${kr(gReq-visJarMon)} mer per månad än du sparar idag.`,type:'w'})
        : h(Tip,{text:`Du klarar det! ${kr(visJarMon-gReq)} per månad kvar att disponera.`,type:'ok'})
    )
  );
}


// ─── DASHBOARD TAB ────────────────────────────────────────────────────────────
function DashboardTab({allBudgets, jars}) {
  const r1=useRef(null),r2=useRef(null),r3=useRef(null),r4=useRef(null);
  const c1=useRef(null),c2=useRef(null),c3=useRef(null),c4=useRef(null);

  const sorted = [...allBudgets].sort((a,b)=>a.month_key.localeCompare(b.month_key));

  const getFixed    = b => (b.expenses||[]).filter(e=>e.type==='fixed').reduce((s,e)=>s+(e.amount||0),0);
  const getFun      = b => (b.expenses||[]).filter(e=>e.type==='fun').reduce((s,e)=>s+(e.amount||0),0);
  // Faktiskt sparande = summan av sparlådornas månadssparande (inte budget-överskott)
  const totalJarMon = jars.reduce((s,j)=>s+(j.monthly||0),0);
  const getSavings  = b => totalJarMon;
  const getRate     = b => (b.income||0) > 0 ? Math.round(totalJarMon/(b.income)*100) : 0;

  useEffect(() => {
    if (sorted.length < 2) return;

    const labels = sorted.map(b => {
      const [y,m] = b.month_key.split('-');
      return MN[+m-1].slice(0,3) + " '" + y.slice(2);
    });

    const base = {
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{labels:{color:'#c3bdb0',font:{size:10},boxWidth:12,padding:10}},
        tooltip:{backgroundColor:'#333330',titleColor:'#f2ede3',bodyColor:'#c3bdb0',borderColor:'#4e4d46',borderWidth:1}
      },
      scales:{
        x:{grid:{color:'#3d3c37'},ticks:{color:'#9e9890',font:{size:10}},border:{color:'#4e4d46'}},
        y:{grid:{color:'#3d3c37'},ticks:{color:'#9e9890',font:{size:10}},border:{color:'#4e4d46'}}
      }
    };
    const yKr = v=>fmtS(v);
    const yPct = v=>v+'%';

    // ── Chart 1: Sparutveckling ──────────────────────────────────────────────
    if(c1.current){c1.current.destroy();c1.current=null;}
    c1.current = new Chart(r1.current, {
      type:'line',
      data:{labels, datasets:[{
        label:'Totalt sparat (kr)',
        data: sorted.map(b=>b.existing_savings||0),
        borderColor:'#98c474', backgroundColor:'rgba(152,196,116,.12)',
        fill:true, tension:.35, pointRadius:4, pointHoverRadius:6, borderWidth:2
      }]},
      options:{...base, scales:{...base.scales,
        y:{...base.scales.y, ticks:{...base.scales.y.ticks, callback:yKr}}
      }}
    });

    // ── Chart 2: Inkomst vs utgifter ─────────────────────────────────────────
    if(c2.current){c2.current.destroy();c2.current=null;}
    c2.current = new Chart(r2.current, {
      type:'bar',
      data:{labels, datasets:[
        {label:'Inkomst',         data:sorted.map(b=>b.income||0),  backgroundColor:'rgba(180,142,192,.75)', borderRadius:3},
        {label:'Fasta kostnader', data:sorted.map(getFixed),         backgroundColor:'#7BAFD4', borderRadius:3},
        {label:'Nöje',            data:sorted.map(getFun),           backgroundColor:'#F4A261', borderRadius:3}
      ]},
      options:{...base, scales:{...base.scales,
        y:{...base.scales.y, ticks:{...base.scales.y.ticks, callback:yKr}}
      }}
    });

    // ── Chart 3: Sparkvot-trend ──────────────────────────────────────────────
    if(c3.current){c3.current.destroy();c3.current=null;}
    c3.current = new Chart(r3.current, {
      type:'line',
      data:{labels, datasets:[
        {label:'Sparkvot', data:sorted.map(getRate),
          borderColor:'#fac7e6', backgroundColor:'rgba(250,199,230,.1)',
          fill:true, tension:.35, pointRadius:4, pointHoverRadius:6, borderWidth:2},
        {label:'Mål 20%', data:sorted.map(()=>20),
          borderColor:'#4e4d46', borderDash:[5,4], pointRadius:0, borderWidth:1.5, label:'Mål 20%'}
      ]},
      options:{...base, scales:{...base.scales,
        y:{...base.scales.y, min:0, max:Math.max(60,...sorted.map(getRate))+10,
           ticks:{...base.scales.y.ticks, callback:yPct}}
      }}
    });

    // ── Chart 4: Kostnadsutveckling per kategori ─────────────────────────────
    if(c4.current){c4.current.destroy();c4.current=null;}
    c4.current = new Chart(r4.current, {
      type:'line',
      data:{labels, datasets:[
        {label:'Fasta kostnader', data:sorted.map(getFixed),
          borderColor:'#7BAFD4', backgroundColor:'rgba(123,175,212,.15)',
          fill:true, tension:.35, pointRadius:3, borderWidth:2},
        {label:'Nöje', data:sorted.map(getFun),
          borderColor:'#F4A261', backgroundColor:'rgba(244,162,97,.15)',
          fill:true, tension:.35, pointRadius:3, borderWidth:2}
      ]},
      options:{...base, scales:{...base.scales,
        y:{...base.scales.y, ticks:{...base.scales.y.ticks, callback:yKr}}
      }}
    });

    return ()=>{[c1,c2,c3,c4].forEach(c=>{if(c.current){c.current.destroy();c.current=null;}});};
  }, [allBudgets]);

  if (sorted.length < 2) return h('div',{style:{textAlign:'center',padding:'4rem 1rem'}},
    h('div',{style:{fontSize:36,marginBottom:12}},'📊'),
    h('div',{style:{fontSize:14,fontWeight:600,color:'var(--tx)',marginBottom:6}},'Historik saknas ännu'),
    h('div',{style:{fontSize:12,color:'var(--tx3)',lineHeight:1.6,maxWidth:320,margin:'0 auto'}},'Fullständig analys aktiveras när du har fyllt i budget för minst 2 månader. Gå till Budget-fliken, välj nästa månad med pilarna och lägg in din data — sedan visas alla diagram här automatiskt.')
  );

  // ── Summary metrics ────────────────────────────────────────────────────────
  const totalSavingsDelta = (sorted[sorted.length-1].existing_savings||0) - (sorted[0].existing_savings||0);
  const avgRate     = Math.round(sorted.reduce((s,b)=>s+getRate(b),0)/sorted.length);
  // Snittinkomst over perioden
  const avgIncome   = Math.round(sorted.reduce((s,b)=>s+(b.income||0),0)/sorted.length);

  return h('div',null,
    h(Card,null,
      h('span',{className:'lbl'},'Sammanfattning · '+sorted.length+' månader med data'),
      h('div',{className:'mets'},
        h(Met,{lbl:'Sparökning totalt',    val:kr(totalSavingsDelta), col:totalSavingsDelta>=0?'var(--green)':'var(--red)'}),
        h(Met,{lbl:'Sparar/mån (lådor)',   val:kr(totalJarMon),       col:'var(--pink)'}),
        h(Met,{lbl:'Sparkvot (snitt)',      val:avgRate+'%',            col:avgRate>=20?'var(--green)':'var(--amb)'}),
        h(Met,{lbl:'Snitinkomst/mån',      val:kr(avgIncome)})
      )
    ),
    h('div',{className:'dash-grid'},
      h(Card,{style:{margin:0}},
        h('span',{className:'lbl'},'Sparutveckling'),
        h('div',{style:{position:'relative',height:190}}, h('canvas',{ref:r1}))
      ),
      h(Card,{style:{margin:0}},
        h('span',{className:'lbl'},'Inkomst vs utgifter'),
        h('div',{style:{position:'relative',height:190}}, h('canvas',{ref:r2}))
      ),
      h(Card,{style:{margin:0}},
        h('span',{className:'lbl'},'Sparkvot per månad'),
        h('div',{style:{position:'relative',height:190}}, h('canvas',{ref:r3}))
      ),
      h(Card,{style:{margin:0}},
        h('span',{className:'lbl'},'Kostnadsutveckling'),
        h('div',{style:{position:'relative',height:190}}, h('canvas',{ref:r4}))
      )
    )
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function App() {
  const [sess,   setSess]      = useState(null);
  const [ready,  setReady]     = useState(false);
  const [isReset,setIsReset]   = useState(false);
  const [profile,setProfile]   = useState(null);
  // Problem 3 fix: restore month from localStorage on mount
  const [month,  setMonth]     = useState(() => lsGet('app:month', today()));
  const [months, setMonths]    = useState([]);
  const [budget, setBudget]    = useState(defBudget());
  const [needCreate,setNeedCreate] = useState(false);
  const [prevBud,setPrevBud]   = useState(null);
  const [jars,   setJars]      = useState([]);
  const [jarRate,setJarRate]   = useState(4);
  const [jarErr, setJarErr]    = useState('');
  const [tab,    setTab]       = useState('budget');
  const [shared, setShared]    = useState([]);
  const [notifs, setNotifs]    = useState([]);
  const [showN,  setShowN]     = useState(false);
  const [saving, setSaving]    = useState(false);
  const [allBudgets, setAllBudgets] = useState([]);
  const budTimer = useRef(null);
  const jarTimers = useRef({});

  // ── Auth listener ──────────────────────────────────────────────────────────
  useEffect(() => {
    db.auth.getSession().then(({data:{session}}) => {
      setSess(session); setReady(true);
      if (session) bootstrap(session);
    });
    const {data:{subscription}} = db.auth.onAuthStateChange((event, session) => {
      if (event==='PASSWORD_RECOVERY') { setIsReset(true); return; }
      setSess(session); setReady(true);
      if (session) bootstrap(session);
      else { setProfile(null); setJars([]); setBudget(defBudget()); setShared([]); setNotifs([]); }
    });
    return () => subscription.unsubscribe();
  }, []);

  // ── Bootstrap after login ──────────────────────────────────────────────────
  const bootstrap = async (session) => {
    const uid = session.user.id;
    const [{data:prof},{data:mths},{data:js},{data:abs}] = await Promise.all([
      q.profile(uid), q.budgetMths(uid), q.jars(uid), q.allBudgets(uid)
    ]);
    if (abs) setAllBudgets(abs);
    if (prof) { setProfile(prof); if (prof.jar_rate!=null) setJarRate(prof.jar_rate); }
    // Newest-first sort so dropdown shows most recent at top
    const mkList = (mths?.map(m=>m.month_key) || []).sort().reverse();
    setMonths(mkList);
    if (js) setJars(js);
    // Restore last month from localStorage (Problem 3)
    const savedMonth = lsGet('app:month', today());
    setMonth(savedMonth);
    await loadBudget(uid, savedMonth);
    loadShared(uid);
    loadNotifs(uid);
  };

  // ── Load budget for a month ─────────────────────────────────────────────────
  const loadBudget = async (uid, mk) => {
    const {data} = await q.budget(uid, mk);
    if (data) {
      setBudget({income:data.income||35000, existing:data.existing_savings||0, expenses:data.expenses||defBudget().expenses});
      setNeedCreate(false);
    } else {
      const {data:prev} = await q.budget(uid, adjMK(mk,-1));
      setPrevBud(prev ? {income:prev.income,existing:prev.existing_savings,expenses:prev.expenses} : null);
      setNeedCreate(true); setBudget(defBudget());
    }
  };

  const loadShared = async (uid) => {
    const {data:mems} = await q.sGoals(uid);
    if (!mems?.length) { setShared([]); return; }
    const ids = mems.map(m=>m.goal_id);
    const {data:allM} = await q.sMembers(ids);
    setShared(mems.filter(m=>m.shared_goals).map(m=>({
      ...m.shared_goals, members:(allM||[]).filter(am=>am.goal_id===m.goal_id)
    })));
  };

  const loadNotifs = async (uid) => {
    const {data} = await q.notifs(uid);
    setNotifs(data||[]);
  };

  // ── Reload months list from DB (source of truth) ────────────────────────────
  const reloadMonths = async (uid) => {
    const {data} = await q.budgetMths(uid||sess.user.id);
    // Only months that actually have a saved budget row belong in the list.
    // Sort newest-first so the dropdown shows most recent at top.
    const mk = (data||[]).map(r=>r.month_key).sort().reverse();
    setMonths(mk);
    return mk;
  };

  // ── Clear current month (zero out values, keep the row) ──────────────────────
  const clearBudget = async () => {
    if (!confirm('Nollställa alla värden för '+fmtMK(month)+'? Månaden finns kvar i menyn men töms på data.')) return;
    const empty = {...defBudget(), income:0, existing:0};
    setBudget(empty);
    await q.saveBudget({user_id:sess.user.id, month_key:month, income:0, existing_savings:0, expenses:[], updated_at:new Date().toISOString()});
    const {data:fresh} = await q.allBudgets(sess.user.id); if (fresh) setAllBudgets(fresh);
  };

  // ── Delete current month entirely ────────────────────────────────────────────
  const deleteMonth = async () => {
    if (!confirm('Ta bort '+fmtMK(month)+' helt från historiken? Detta går inte att ångra.')) return;
    await db.from('budgets').delete().eq('user_id',sess.user.id).eq('month_key',month);
    const {data:fresh} = await q.allBudgets(sess.user.id); if (fresh) setAllBudgets(fresh);
    // Reload months from DB — do NOT rely on local filter which may be stale
    const mk = await reloadMonths();
    // Navigate to most recent remaining month (or today as blank slate)
    const fallback = mk.length ? mk[0] : today();
    // Use switchMonth (not goMonth) to avoid re-adding deleted month
    await switchMonth(fallback);
  };

  // ── switchMonth: navigate WITHOUT mutating the months list ───────────────────
  // goMonth used to add the target to months[] immediately — that caused the
  // cancel-loop because the empty month appeared in the list before any budget
  // was saved. switchMonth only loads data; months[] is only updated by
  // reloadMonths() (called after actual DB writes).
  const switchMonth = async (mk) => {
    setMonth(mk); lsSet('app:month', mk);
    if (sess) await loadBudget(sess.user.id, mk);
  };

  // ── goMonth: public nav handler (keeps months list in sync) ──────────────────
  // Called by MonthNav arrows/dropdown. We reload from DB after navigation so
  // the list only ever contains months that actually exist in the database.
  const goMonth = async (mk) => {
    setMonth(mk); lsSet('app:month', mk);
    if (sess) {
      await loadBudget(sess.user.id, mk);
      // If a budget was just created for this month it'll appear after createMonth.
      // If we're just peeking at an empty month, don't add it to the list.
    }
  };

  // ── cancelCreate: go back without triggering needCreate again ─────────────────
  const cancelCreate = () => {
    setNeedCreate(false);
    // Navigate to the most recent month that has actual saved data.
    // months[] only contains DB-backed months (reloadMonths ensures this).
    const fallback = months.length ? months[0] : null;
    if (fallback && fallback !== month) {
      switchMonth(fallback);
    } else {
      // No other months exist — just hide the modal, stay on current month
      // without creating a budget. User sees the empty app state.
      setNeedCreate(false);
    }
  };

  // ── Create month ─────────────────────────────────────────────────────────────
  const createMonth = async (copy) => {
    const b = copy&&prevBud ? {...prevBud,expenses:(prevBud.expenses||[]).map(e=>({...e}))} : defBudget();
    setBudget(b); setNeedCreate(false);
    if (!sess) return;
    await q.saveBudget({user_id:sess.user.id, month_key:month, income:b.income, existing_savings:b.existing||0, expenses:b.expenses});
    // Now reload months from DB — the new month will appear in the list
    await reloadMonths();
    const {data:fresh} = await q.allBudgets(sess.user.id); if (fresh) setAllBudgets(fresh);
  };

  // ── Budget change (debounced) ─────────────────────────────────────────────────
  const onBudgetChange = (newB) => {
    setBudget(newB);
    clearTimeout(budTimer.current);
    budTimer.current = setTimeout(async () => {
      if (!sess) return;
      setSaving(true);
      await q.saveBudget({user_id:sess.user.id, month_key:month, income:newB.income, existing_savings:newB.existing, expenses:newB.expenses, updated_at:new Date().toISOString()});
      const {data:fresh} = await q.allBudgets(sess.user.id);
      if (fresh) setAllBudgets(fresh);
      setSaving(false);
    }, 800);
  };

  // ── Jar operations (Problem 1 fix) ────────────────────────────────────────────
  const addJar = async () => {
    if (!sess) return;
    setJarErr('');
    const newJar = {user_id:sess.user.id, name:'', balance:0, monthly:0, target:0, hidden:false, sort_order:jars.length};
    // Optimistic update first so UI responds immediately
    const tempId = 'temp-'+Date.now();
    setJars(p=>[...p,{...newJar,id:tempId}]);
    const {data, error} = await q.addJar(newJar);
    if (error) {
      // Rollback on failure and show error
      setJars(p=>p.filter(j=>j.id!==tempId));
      setJarErr(error.message);
      console.error('[addJar]', error);
      return;
    }
    // Replace temp with real row
    setJars(p=>p.map(j=>j.id===tempId?data:j));
  };

  const updateJar = async (id, field, val) => {
    // _flush = save current row to DB on blur.
    // Uses functional setJars so the callback always reads the LATEST state,
    // never a stale closure captured at call-time.
    if (field==='_flush') {
      if (typeof id === 'string' && id.startsWith('temp-')) return;
      clearTimeout(jarTimers.current[id]);
      jarTimers.current[id] = setTimeout(() => {
        setJars(current => {
          const j = current.find(x => x.id === id);
          if (j) {
            q.updJar(id, {name:j.name, balance:j.balance, monthly:j.monthly, target:j.target, hidden:j.hidden})
              .then(({error}) => { if (error) { setJarErr(error.message); console.error('[flush]', error); } });
          }
          return current; // no state change, just a read
        });
      }, 350);
      return;
    }
    // Optimistic UI update
    setJars(prev => prev.map(j => j.id===id ? {...j,[field]:val} : j));
    // Immediately persist booleans and strings (hidden toggle, name field)
    if (typeof val==='boolean' || typeof val==='string') {
      if (typeof id === 'string' && id.startsWith('temp-')) return;
      const {error} = await q.updJar(id, {[field]: val});
      if (error) { setJarErr(error.message); console.error('[updateJar]', error); }
    }
  };

  const deleteJar = async (id) => {
    setJars(p=>p.filter(j=>j.id!==id));
    if (!id.startsWith('temp-')) {
      const {error} = await q.delJar(id);
      if (error) { setJarErr(error.message); console.error('[deleteJar]',error); }
    }
  };

  const saveJarRate = async (r) => {
    setJarRate(r);
    if (sess) await db.from('profiles').update({jar_rate:r}).eq('id',sess.user.id);
  };

  // ── Notifications ─────────────────────────────────────────────────────────────
  const acceptInvite = async (n) => {
    const d=n.data||{};
    await db.from('shared_goal_members').update({status:'accepted'}).eq('goal_id',d.goal_id).eq('user_id',sess.user.id);
    await q.markRead(n.id);
    setNotifs(p=>p.filter(x=>x.id!==n.id));
    loadShared(sess.user.id);
  };
  const declineInvite = async (n) => {
    const d=n.data||{};
    await db.from('shared_goal_members').update({status:'declined'}).eq('goal_id',d.goal_id).eq('user_id',sess.user.id);
    await q.markRead(n.id);
    setNotifs(p=>p.filter(x=>x.id!==n.id));
  };

  const logout = async () => {
    clearTimeout(budTimer.current);
    await db.auth.signOut();
  };

  // ── Render ────────────────────────────────────────────────────────────────────
  if (!ready)        return h('div',{className:'load-wrap'},h(Spin));
  if (isReset)       return h(ResetPage);
  if (!sess)         return h(AuthPage);

  const uid = sess.user.id;
  const visibleJarMon = jars.reduce((s,j)=>s+(j.monthly||0),0); // Alla lådor inkl. dolda räknas i 50/30/20
  const TABS = [['budget','Budget'],['jars','Sparlådor'],['gemensamt','Gemensamt'],['prognos','Prognos'],['oversikt','Översikt']];

  if (needCreate) return h('div',{className:'app'},
    h(CreateMonth,{month, hasPrev:!!prevBud, onCreate:createMonth, onCancel:cancelCreate})
  );

  return h('div',{className:'app'},
    // ── Header ──────────────────────────────────────────────────────────────
    h('div',{className:'hdr'},
      h('div',null,
        h('div',{style:{fontSize:11,textTransform:'uppercase',letterSpacing:'.14em',color:'var(--pink)',fontWeight:600}},'Min Ekonomi'),
        h('div',{style:{fontSize:13,color:'var(--tx2)'}},profile?.name||sess.user.email)
      ),
      h(MonthNav,{month,months,onGo:goMonth}),
      h('div',{style:{display:'flex',gap:8,alignItems:'center'}},
        saving && h('div',{style:{width:14,height:14,border:'2px solid var(--bd)',borderTopColor:'var(--pink)',borderRadius:'50%',animation:'rot .7s linear infinite'}}),
        h('button',{
          style:{position:'relative',background:'none',border:'1px solid var(--bd)',borderRadius:'var(--r)',padding:'6px 10px',color:'var(--tx2)',fontSize:13},
          onClick:()=>setShowN(!showN),'aria-label':'Notiser'
        }, '🔔', notifs.length>0 && h('span',{className:'badge',style:{position:'absolute',top:-6,right:-6}},notifs.length)),
        h('button',{className:'btn-g',onClick:logout},'Logga ut')
      )
    ),
    // ── Tabs ────────────────────────────────────────────────────────────────
    h('div',{className:'tabs'},TABS.map(([k,l])=>h('button',{key:k,className:'tab-btn'+(tab===k?' on':''),onClick:()=>{setTab(k);setShowN(false);}},l))),
    // ── Content ─────────────────────────────────────────────────────────────
    h('div',{className:'content'},
      showN && h(NotifPanel,{notifs,onAccept:acceptInvite,onDecline:declineInvite,onClose:()=>setShowN(false)}),
      !showN && tab==='budget'    && h(BudgetTab,{budget,onChange:onBudgetChange,visibleJarMon,onClear:clearBudget,onDelete:deleteMonth}),
      !showN && tab==='jars'      && h(JarsTab,{jars,jarRate,onAdd:addJar,onUpdate:updateJar,onDelete:deleteJar,onRate:saveJarRate,jarErr}),
      !showN && tab==='gemensamt' && h(SharedTab,{userId:uid,userEmail:sess.user.email,userName:profile?.name||'',sharedGoals:shared,onReload:()=>loadShared(uid)}),
      !showN && tab==='prognos'   && h(PrognosTab,{budget,jars}),
      !showN && tab==='oversikt'  && h(DashboardTab,{allBudgets,jars})
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
